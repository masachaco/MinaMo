<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b10" />
<title>MinaMo（スマホ版・試作）</title>
<meta name="description" content="歌に合わせて画面のパッドを叩くと、歌詞やエフェクトがその場で広がる。リリック MV を作るブラウザアプリのスマホ版（試作）。" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="MinaMo" />
<meta property="og:title" content="MinaMo スマホ版（試作）" />
<meta property="og:description" content="歌に合わせて画面のパッドを叩くと、歌詞やエフェクトがその場で広がる。リリック MV を作るブラウザアプリ。" />
<meta property="og:url" content="https://masachaco.github.io/MinaMo/mobile/" />
<meta property="og:image" content="https://masachaco.github.io/MinaMo/og.jpg" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230b0b10'/%3E%3Ccircle cx='12' cy='12' r='2.6' fill='%2308d9d6'/%3E%3Ccircle cx='12' cy='12' r='6.2' fill='none' stroke='%2308d9d6' stroke-width='1.6' opacity='.75'/%3E%3Ccircle cx='12' cy='12' r='9.6' fill='none' stroke='%2308d9d6' stroke-width='1.3' opacity='.45'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Dela+Gothic+One&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&family=Mochiy+Pop+One&family=Montserrat:wght@300;500;600;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Orbitron:wght@500;900&family=Share+Tech+Mono&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" />
</head>
<body class="m">
<div id="m-app">
  <header class="m-top">
    <div class="brand"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.6" fill="currentColor"/><circle cx="12" cy="12" r="6.4" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".7"/><circle cx="12" cy="12" r="10.2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".35"/></svg><span>Mina<b>Mo</b></span></div>
    <div class="m-tc"><span id="tcTime">0:00.00</span><span id="tcBar">001.1</span></div>
    <span id="status" class="status"></span>
    <button id="btnUndo" class="icon" aria-label="元に戻す">↶</button>
    <button id="btnRedo" class="icon" aria-label="やり直し">↷</button>
    <button id="btnMenu" class="icon" aria-label="メニュー">☰</button>
  </header>
  <div class="m-stage" id="viewport">
    <div class="frame" id="frame"><canvas id="out"></canvas><div class="rec-badge">● REC</div></div>
  </div>
  <div class="m-prompter" id="prompter"></div>
  <div class="m-seek"><input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="再生位置" /></div>
  <div class="m-transport">
    <button id="btnHome" class="icon" aria-label="先頭へ">⏮</button>
    <button id="btnBack" class="icon" aria-label="1小節戻る">«</button>
    <button id="btnPlay" class="icon primary" aria-label="再生 / 停止">▶</button>
    <button id="btnFwd" class="icon" aria-label="1小節進む">»</button>
    <button id="btnRec" class="rec">● REC</button>
    <button id="btnOverdub" class="small"></button>
  </div>
  <nav class="m-tabs" id="modeTabs"></nav>
  <main class="m-pads" id="pads"></main>
</div>

<div class="m-drawer" id="drawer" hidden>
  <div class="m-drawer-card" id="drawerBody"></div>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="/src/mobile/main.ts"></script>
</body>
</html>
